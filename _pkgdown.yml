url: https://davidgz1.github.io/HowMaHiCo/

template:
  bootstrap: 5

reference:
- title: Render reports
  desc: >
    Entry points that build the cached pep_all table and render the parameterized
    QC report templates (00_mhc_report all-in-one, or the focused 01-06 reports)
  contents:
  - build_pep_all
  - run_howmahico_report
  - derive_filtered_annotation
  - get_report_template

- title: Annotation
  desc: Read, validate, display, and auto-generate sample annotation tables
  contents:
  - read_annot
  - print_annot
  - get_annot_fragpipe
  - get_annot_diann
  - get_annot_peaks
  - get_annot_sampleid

- title: Report helpers
  desc: >
    Shared settings the report templates derive from their params: the MHC
    length window and palette, and the Condition pairs to compare
  contents:
  - mhc_length_window
  - mhc_class_palette
  - mhc_classes
  - condition_pairs

- title: Data loaders
  desc: Software-specific loader families that converge on the unified `pep_all` schema
  contents:
  - read_fragpipe
  - read_fragpipe_batch
  - parse_fragpipe
  - annotate_fragpipe
  - read_diann
  - read_diann_batch
  - parse_diann
  - annotate_diann
  - read_peaks
  - read_peaks_batch
  - parse_peaks
  - annotate_peaks

- title: Custom (dictionary-driven) parsing
  desc: >
    The `software = "custom"` path: ingest a tabular export from a tool with no
    built-in loader by editing a YAML dictionary instead of writing R code.
  contents:
  - get_dictionary_template
  - read_dictionary
  - read_custom_batch
  - parse_unified
  - annotate_unified

- title: Checks
  desc: Guard against clobbering existing output and summarise global ID composition
  contents:
  - check_file_exists
  - check_output_exists
  - check_ids_global

- title: Counting & overlap analysis
  desc: Tabulate ID counts, charge/area summaries, sequence lists, and cross-condition overlaps
  contents:
  - count_ids
  - count_ids_condition_bylengthrange
  - count_ids_by
  - get_charge_group
  - get_proportion_charge
  - get_mat_log2area
  - summarise_area
  - list_sequences
  - count_intersect
  - count_merged
  - count_samples_patients
  - select_unique
  - filter_unique

- title: Plotting
  desc: QC plots covering ID size/charge distributions, overlaps, motifs, and correlation
  contents:
  - plot_peplength_dens
  - plot_peplength_hist
  - plot_pepmass
  - plot_pepmz
  - plot_bp_count_length
  - plot_count_mean_sd
  - plot_prop_length_condition
  - plot_charge_proportions
  - plot_overlap_intra_condition
  - plot_upset
  - plot_upset_batch
  - plot_pseudochromatogram
  - plot_pseudomobilogram
  - plot_2d_distribution
  - plot_violin_areacv
  - plot_qc_box
  - plot_qc_violin
  - plot_corr
  - plot_ptm_heatmap
  - ggseqlogo_bylength
  - theme_rawr
  - theme_howmahico

- title: Sample quality score
  desc: >
    Per-sample immunopeptidomics quality score behind the 05_quality_score
    report: raw signals (length-window fidelity, canonical-length dominance,
    anchor-motif clarity, non-tryptic specificity, charge plausibility, depth,
    mass accuracy, cross-class contamination), the threshold model, and the
    weighted 0-100 composite.
  contents:
  - score_sample_quality
  - qc_metrics_by_sample
  - anchor_information_content
  - score_curve
  - quality_thresholds_default
  - calibrate_thresholds_from_qc
  - plot_quality_heatmap
  - plot_quality_composite
  - plot_cross_class_length

- title: Advanced quantification & statistics
  desc: >
    Build the quantitative matrix and compare peptide Area between Conditions
    (filtering, normalization, imputation, limma moderated t / Welch t, Fisher
    presence-absence, PERMANOVA) plus the plots of the 06_quant_stats report
  contents:
  - build_quant_matrix
  - filter_quant
  - normalize_quant
  - impute_quant
  - test_differential
  - test_detection
  - combine_quant_results
  - summarise_significant
  - permanova_condition
  - plot_completeness
  - plot_missing_heatmap
  - plot_intensity_dist
  - plot_dynamic_range
  - plot_pca
  - plot_quant_heatmap
  - plot_volcano
  - plot_ma
  - plot_pvalue_hist
  - plot_sig_summary

- title: Physicochemical properties
  desc: >
    Peptide-chemistry engine behind the 07_pepchem report: amino-acid
    composition, per-position residue frequency and per-peptide descriptors
    (GRAVY, pI, charge, ...), summarised per sample and compared between
    Conditions.
  contents:
  - peptide_properties
  - pepchem_properties
  - aa_composition
  - aa_position_frequency
  - pepchem_by_sample
  - summarise_pepchem
  - aggregate_pepchem
  - cliffs_delta
  - compare_pepchem
  - compare_aa_frequency
  - plot_aa_composition
  - plot_aa_position_heatmap
  - plot_property_distribution
  - plot_property_sample_summary
  - plot_property_effectsize

- title: Export & I/O helpers
  desc: Write report outputs (plots, csvs, render parameters) to disk
  contents:
  - ggsave_rawr
  - ggprint_rawr
  - write.csv_rawr
  - write_input_params

- title: Package overview
  contents:
  - HowMaHiCo-package
