# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # nloptr/textshaping/ragg (transitive deps of the ggplot2/rmarkdown stack)
      # need these system libraries on Ubuntu; not present on the runner image
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libharfbuzz-dev libfribidi-dev pandoc

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every top-level *.md as a site page and has no config
      # option to skip one (it ignores .Rbuildignore), so the internal working
      # notes are removed from the CI checkout only. Never committed back.
      - name: Exclude internal notes from the site
        run: rm -f CLAUDE.md plans_dgz.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          # true: drop pages no longer built (e.g. CLAUDE.html, plans_dgz.html)
          clean: true
          branch: gh-pages
          folder: docs
